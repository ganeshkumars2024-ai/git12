apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wishlist-v3
  template:
    metadata:
      labels:
        app: wishlist-v3
    spec:
      containers:
        - name: wishlist
          image: 24mis0260/wishlist:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v3"
---
apiVersion: v1
kind: Service
metadata:
  name: wishlist-v3
spec:
  selector:
    app: wishlist-v3
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP